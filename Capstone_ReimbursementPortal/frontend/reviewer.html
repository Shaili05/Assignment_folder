<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Claims</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Reimbursement Portal</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="reviewer.html">Review Claims</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Claims Assigned to Me</h2>
        <input type="number" id="reviewerId" placeholder="Your Reviewer ID" />
        <button onclick="loadReviewerClaims()">Load Claims</button>
        <div id="reviewerMsg" class="msg" style="display:none"></div>
        <table id="reviewerTable" style="display:none">
            <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="reviewerBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Take Action on a Claim</h2>
        <input type="number" id="claimId" placeholder="Claim ID" />
        <input type="number" id="actionReviewerId" placeholder="Your Reviewer ID" />
        <textarea id="comment" placeholder="Add a comment (required for rejection)"></textarea>
        <button class="approve" onclick="handleApprove()">Approve</button>
        <button class="reject" onclick="handleReject()">Reject</button>
        <div id="actionMsg" class="msg" style="display:none"></div>
    </div>

</div>

<script src="js/api.js"></script>
<script>
    async function loadReviewerClaims() {
        const reviewerId = document.getElementById('reviewerId').value;

        if (!reviewerId) {
            showMessage('reviewerMsg', 'Please enter your Reviewer ID', true);
            return;
        }

        const result = await getReviewerClaims(reviewerId);

        if (result.status === 'success') {
            const claims = result.data.content;
            const tbody = document.getElementById('reviewerBody');
            tbody.innerHTML = '';

            if (claims.length === 0) {
                showMessage('reviewerMsg', 'No claims assigned to you', true);
                return;
            }

            claims.forEach(claim => {
                tbody.innerHTML += `
                    <tr>
                        <td>${claim.id}</td>
                        <td>${claim.employeeName}</td>
                        <td>₹${claim.amount}</td>
                        <td>${claim.date}</td>
                        <td>${claim.description}</td>
                        <td class="${getStatusClass(claim.status)}">${claim.status}</td>
                        <td>${claim.status === 'SUBMITTED' ? 'Pending' : 'Done'}</td>
                    </tr>
                `;
            });

            document.getElementById('reviewerTable').style.display = 'table';
        } else {
            showMessage('reviewerMsg', result.message || 'Something went wrong', true);
        }
    }

    async function handleApprove() {
        const claimId = document.getElementById('claimId').value;
        const reviewerId = document.getElementById('actionReviewerId').value;
        const comment = document.getElementById('comment').value;

        if (!claimId || !reviewerId) {
            showMessage('actionMsg', 'Please enter Claim ID and Reviewer ID', true);
            return;
        }

        const result = await approveClaim(claimId, parseInt(reviewerId), comment);

        if (result.status === 'success') {
            showMessage('actionMsg', 'Claim approved successfully!');
            loadReviewerClaims();
        } else {
            showMessage('actionMsg', result.message || 'Something went wrong', true);
        }
    }

    async function handleReject() {
        const claimId = document.getElementById('claimId').value;
        const reviewerId = document.getElementById('actionReviewerId').value;
        const comment = document.getElementById('comment').value;

        if (!claimId || !reviewerId || !comment) {
            showMessage('actionMsg', 'Please enter Claim ID, Reviewer ID and a comment', true);
            return;
        }

        const result = await rejectClaim(claimId, parseInt(reviewerId), comment);

        if (result.status === 'success') {
            showMessage('actionMsg', 'Claim rejected successfully!');
            loadReviewerClaims();
        } else {
            showMessage('actionMsg', result.message || 'Something went wrong', true);
        }
    }
</script>

</body>
</html>
