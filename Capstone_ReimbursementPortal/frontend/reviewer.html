<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Review Claims</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Reimbursement Portal</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="reviewer.html">Review Claims</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Claims Assigned to Me</h2>
        <input type="number" id="reviewerId"
               placeholder="Your Reviewer ID" min="1"/>
        <button onclick="loadReviewerClaims()">Load Claims</button>
        <div id="reviewerMsg" class="msg" style="display:none"></div>
        <table id="reviewerTable" style="display:none">
            <thead>
            <tr>
                <th>ID</th>
                <th>Employee</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Description</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="reviewerBody"></tbody>
        </table>
    </div>

    <div class="card">
        <h2>Take Action on a Claim</h2>
        <input type="number" id="claimId"
               placeholder="Claim ID" min="1"/>
        <input type="number" id="actionReviewerId"
               placeholder="Your Reviewer ID" min="1"/>
        <textarea id="comment"
                  placeholder="Add a comment (required for rejection)">
        </textarea>
        <button class="approve" onclick="handleApprove()">Approve</button>
        <button class="reject" onclick="handleReject()">Reject</button>
        <div id="actionMsg" class="msg" style="display:none"></div>
    </div>

</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/reviewer.js"></script>

</body>
</html>
