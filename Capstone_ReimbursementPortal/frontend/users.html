<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Reimbursement Portal</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Create New User</h2>
        <input type="text" id="name" placeholder="Full Name" />
        <input type="email" id="email" placeholder="Email (must be @company.com)" />
        <input type="password" id="password" placeholder="Password (min 8 characters)" />
        <select id="role">
            <option value="">-- Select Role --</option>
            <option value="ADMIN">Admin</option>
            <option value="MANAGER">Manager</option>
            <option value="EMPLOYEE">Employee</option>
        </select>
        <button onclick="handleCreateUser()">Create User</button>
        <div id="createMsg" class="msg" style="display:none"></div>
    </div>

    <div class="card">
        <h2>Assign Manager to Employee</h2>
        <input type="number" id="empId" placeholder="Employee ID" />
        <input type="number" id="mgrId" placeholder="Manager ID" />
        <button onclick="handleAssignManager()">Assign Manager</button>
        <div id="assignMsg" class="msg" style="display:none"></div>
    </div>

    <div class="card">
        <h2>All Users</h2>
        <button onclick="loadUsers()">Refresh List</button>
        <div id="usersMsg" class="msg" style="display:none"></div>
        <table id="usersTable" style="display:none">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Manager</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>

</div>

<script src="js/api.js"></script>
<script>
    loadUsers();

    async function handleCreateUser() {
        const data = {
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            password: document.getElementById('password').value,
            role: document.getElementById('role').value
        };

        const result = await createUser(data);

        if (result.status === 'success') {
            showMessage('createMsg', 'User created successfully!');
            loadUsers();
        } else {
            showMessage('createMsg', result.message || 'Something went wrong', true);
        }
    }

    async function handleAssignManager() {
        const empId = document.getElementById('empId').value;
        const mgrId = document.getElementById('mgrId').value;

        if (!empId || !mgrId) {
            showMessage('assignMsg', 'Please enter both IDs', true);
            return;
        }

        const result = await assignManager(empId, mgrId);

        if (result.status === 'success') {
            showMessage('assignMsg', 'Manager assigned successfully!');
            loadUsers();
        } else {
            showMessage('assignMsg', result.message || 'Something went wrong', true);
        }
    }

    async function loadUsers() {
        const result = await getAllUsers();

        if (result.status === 'success') {
            const users = result.data.content;
            const tbody = document.getElementById('usersBody');
            tbody.innerHTML = '';

            users.forEach(user => {
                tbody.innerHTML += `
                    <tr>
                        <td>${user.id}</td>
                        <td>${user.name}</td>
                        <td>${user.email}</td>
                        <td>${user.role}</td>
                        <td>${user.managerName || '-'}</td>
                        <td><button onclick="deleteUser(${user.id})">Delete</button></td>
                    </tr>
                `;
            });

            document.getElementById('usersTable').style.display = 'table';
        }
    }

    async function deleteUser(id) {
        if (!confirm('Are you sure you want to delete this user?')) return;

        const res = await fetch(`http://localhost:8081/api/users/${id}`, {
            method: 'DELETE'
        });
        const result = await res.json();

        if (result.status === 'success') {
            showMessage('usersMsg', 'User deleted!');
            loadUsers();
        } else {
            showMessage('usersMsg', result.message || 'Delete failed', true);
        }
    }
</script>

</body>
</html>
