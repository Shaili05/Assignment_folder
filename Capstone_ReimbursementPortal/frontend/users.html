<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Reimbursement Portal</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="users.html">Users</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Create New User</h2>
        <input type="text" id="name" placeholder="Full Name" />
        <input type="email" id="email"
               placeholder="Email (must be @company.com)" />
        <input type="password" id="password"
               placeholder="Password (min 8 characters)" />
        <select id="role">
            <option value="">-- Select Role --</option>
            <option value="ADMIN">Admin</option>
            <option value="MANAGER">Manager</option>
            <option value="EMPLOYEE">Employee</option>
        </select>
        <button onclick="handleCreateUser()">Create User</button>
        <div id="createMsg" class="msg" style="display:none"></div>
    </div>

    <div class="card">
        <h2>Assign Manager to Employee</h2>
        <input type="number" id="empId" placeholder="Employee ID" min="1"/>
        <input type="number" id="mgrId" placeholder="Manager ID" min="1"/>
        <button onclick="handleAssignManager()">Assign Manager</button>
        <div id="assignMsg" class="msg" style="display:none"></div>
    </div>

    <div class="card">
        <h2>All Users</h2>
        <button onclick="loadUsers()">Refresh List</button>
        <div id="usersMsg" class="msg" style="display:none"></div>
        <table id="usersTable" style="display:none">
            <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Role</th>
                <th>Manager</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="usersBody"></tbody>
        </table>
    </div>

</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/users.js"></script>

</body>
</html>
