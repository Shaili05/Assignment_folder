<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Claims</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header>
    <h1>Reimbursement Portal</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="claims.html">My Claims</a>
    </nav>
</header>

<div class="container">

    <div class="card">
        <h2>Submit a Claim</h2>
        <input type="number" id="employeeId"
               placeholder="Your Employee ID" min="1"/>
        <input type="number" id="amount"
               placeholder="Amount (e.g. 5000)" step="0.01" min="1"/>
        <input type="date" id="date" />
        <textarea id="description"
                  placeholder="What was this expense for?"></textarea>
        <button onclick="handleSubmitClaim()">Submit Claim</button>
        <div id="submitMsg" class="msg" style="display:none"></div>
    </div>

    <div class="card">
        <h2>My Previous Claims</h2>
        <input type="number" id="viewEmployeeId"
               placeholder="Your Employee ID" min="1"/>
        <button onclick="handleViewClaims()">View My Claims</button>
        <div id="claimsMsg" class="msg" style="display:none"></div>
        <table id="claimsTable" style="display:none">
            <thead>
            <tr>
                <th>ID</th>
                <th>Amount</th>
                <th>Date</th>
                <th>Description</th>
                <th>Status</th>
                <th>Reviewer Comment</th>
            </tr>
            </thead>
            <tbody id="claimsBody"></tbody>
        </table>
    </div>

</div>

<script src="js/utils.js"></script>
<script src="js/api.js"></script>
<script src="js/claims.js"></script>

</body>
</html>
